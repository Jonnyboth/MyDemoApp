[pytest]
addopts = -v -s
markers =
    component: TODOS los casos de un endpoint aislado (1 archivo por endpoint/TC en tests/tests/component/) — se aplica siempre como decorador.
    e2e: flujos de negocio completos encadenando varios endpoints (código propio en tests/tests/e2e/) — se aplica siempre como decorador.
    smoke: subconjunto camino-feliz de component, reexportado por import en tests/tests/smoke/ — la selección es por carpeta (pytest tests/smoke/), no por decorador.
    regression: subconjunto feliz+alternos de component, reexportado por import en tests/tests/regression/ — la selección es por carpeta (pytest tests/regression/), no por decorador.
    scenario_name(name): nombre legible del escenario para reportes, formato "<KEY-TC> <validación principal>" (ej. "SIM-TC-12 Create user age value Mayor 100") — se imprime en consola y en el reporte HTML; es metadata de reporte, no filtra tests.
# Suite exhaustiva por defecto = component + e2e (sin duplicados). smoke/ y
# regression/ son reexportaciones por import de tests que ya corren en
# component/: se invocan explícitamente por carpeta (pytest tests/smoke/),
# nunca quedan incluidas en un `pytest` a secas para no duplicar llamadas
# reales a la API.
testpaths = tests/component tests/e2e
python_files = test_*.py
python_classes = Test*
python_functions = test_*
